name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            react website/package-lock.json
            freespirit dance redesign choice/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/original/

      - name: Install the redesign choice
        working-directory: freespirit dance redesign choice
        run: npm ci

      - name: Build the redesign choice
        working-directory: freespirit dance redesign choice
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Put the redesign at the main address and the original under /original
        run: |
          cp -R "../freespirit dance redesign choice/dist" dist/pages
          cp -R dist/site dist/pages/original
          touch dist/pages/.nojekyll

      - name: Publish dist/pages to the gh-pages branch
        working-directory: react website/dist/pages
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
